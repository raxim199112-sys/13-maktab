const M={sh:'ш',ch:'ч',yo:'ё',yu:'ю',ya:'я','o‘':'ў','g‘':'ғ',a:'а',b:'б',d:'д',e:'е',f:'ф',g:'г',h:'ҳ',i:'и',j:'ж',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',q:'қ',r:'р',s:'с',t:'т',u:'у',v:'в',x:'х',y:'й',z:'з'};
const cyr=s=>s.replace(/sh|ch|yo|yu|ya|o‘|g‘|./gi,m=>{const l=M[m.toLowerCase()];return l?(m[0]!==m[0].toLowerCase()?l[0].toUpperCase()+l.slice(1):l):m});
const LO={2000:0,0:1,2001:2};
if(!db.v3){
const N=['Karimova Dilnoza','Toshmatov Aziz','Rahimova Nigora','Ismoilov Doniyor','Sobirova Gulnora','Ergashev Sardor','Xolmatova Zilola','Abdullayeva Madina','Normatov Jamshid','Hasanova Shahnoza','Mirzayev Akmal','Turgunova Feruza','Sultonov Bekzod','Qosimova Sevara','Aliyev Ulug‘bek','Usmonova Barno','Saidov Rustam','Jo‘rayeva Kamola','Tursunov Eldor','Qo‘ziyeva Mohira','Bekmurodov Sanjar','Ahmedova Nodira','Davronov Islom','Qobilova Lola','Hakimov Farrux','Mamatqulova Sabina','Rustamov Behruz','Nurmatova Zarina','Olimov Shaxzod','Ibragimova Muhayyo'];
const base=(id,nm,role,phone)=>({id,dir:true,name:[nm,cyr(nm),cyr(nm)],subject:role,cat:-1,experience:['—','—','—'],degree:['—','—','—'],bio:['Ma’lumot kiritilmagan.','Ақпарат енгізілмеген.','Информация не указана.'],achievements:['—','—','—'],phone:phone,photo:''});
db.teachers=[
base(0,'Yusupov Sherzod',['Maktab direktori','Мектеп директоры','Директор школы'],'+998 (71) 200-13-13'),
base(2000,'Nazarova Malika',['O‘quv ishlari bo‘yicha direktor o‘rinbosari (zavuch)','Директордың оқу ісі жөніндегі орынбасары (завуч)','Завуч (зам. директора по учебной работе)'],''),
base(2001,'Qodirov Otabek',['Ma’naviy-ma’rifiy ishlar bo‘yicha o‘rinbosar','Рухани-ағартушылық жұмыс жөніндегі орынбасар','Зам. директора по духовно-просветительской работе'],'')];
N.forEach((nm,i)=>{const s=SUBJ[i%14];const o=base(3000+i,nm,[s[1]+' o‘qituvchisi',s[2]+' мұғалімі','Учитель: '+s[3]],'');delete o.dir;o.cat=s[0];db.teachers.push(o)});
db.v3=true;db.leaders=true;db.seeded=true;saveData();
}
const $=id=>document.getElementById(id),t=k=>I[k][L],tr=v=>Array.isArray(v)?v[L]:(v||''),pic=x=>x.photo||avatar(tr(x.name),x.id);
function saveData(){try{localStorage.setItem('maktab13_data',JSON.stringify(db))}catch(e){}}
function avatar(name,i){const h=(i*53)%360,ini=(name||'M').split(' ').slice(0,2).map(w=>w[0]).join('');
return 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl('+h+',70%,58%)"/><stop offset="1" stop-color="hsl('+((h+40)%360)+',70%,34%)"/></linearGradient></defs><rect width="200" height="200" fill="url(#g)"/><circle cx="100" cy="76" r="34" fill="#fff" fill-opacity=".88"/><path d="M34 200c4-44 32-64 66-64s62 20 66 64z" fill="#fff" fill-opacity=".88"/><text x="100" y="86" text-anchor="middle" font-size="26" font-weight="700" fill="hsl('+h+',60%,28%)" font-family="sans-serif">'+ini+'</text></svg>')}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function updateTexts(){
document.querySelectorAll('[data-i]').forEach(el=>{const k=el.dataset.i;if(I[k])el.textContent=I[k][L]});
document.querySelectorAll('[data-p]').forEach(el=>{const k=el.dataset.p;if(I[k])el.placeholder=I[k][L]});
document.documentElement.lang=['uz','kk','ru'][L];
}
function setLang(i){L=i;updateTexts();renderAll()}

function count(el,to){let n=0;const step=Math.max(1,Math.ceil(to/50));const iv=setInterval(()=>{n=Math.min(to,n+step);el.textContent=n;if(n>=to)clearInterval(iv)},25)}
function adminToggle(){
if(role==='admin'){role=null;applyRole();toast(t('lf'));return}
const p=prompt(t('ap'));if(p===null)return;
if(p===ADMIN_PASS){role='admin';applyRole();toast(t('lo'))}else alert(t('wp'));
}
function applyRole(){
const a=role==='admin';
$('st-ctrl').classList.toggle('hidden',!a);
$('add-btn').classList.toggle('hidden',!a);
$('admin-btn').textContent=a?'🔓':'🔒';
}

function renderAll(){
$('st-input').value=db.students;
$('st-students').textContent=db.students;
$('filters').innerHTML=`<button onclick="setFilter('all')" class="px-4 py-2 rounded-xl text-xs font-semibold ${filter==='all'?'bg-blue-600 text-white':'bg-white text-slate-600 border border-slate-200'}">${t('all')}</button>`+
[0,1,2,3].map(i=>`<button onclick="setFilter(${i})" class="px-4 py-2 rounded-xl text-xs font-semibold ${filter===i?'bg-blue-600 text-white':'bg-white text-slate-600 border border-slate-200'}">${t('c'+i)}</button>`).join('');
$('dir-box').innerHTML=db.teachers.filter(x=>x.dir).sort((a,b)=>(LO[a.id]??9)-(LO[b.id]??9)).map((d,i)=>`<div onclick="openView(${d.id})" class="card w-60 bg-white rounded-3xl p-6 shadow-xl border ${d.id===0?'border-blue-300 ring-2 ring-blue-200 order-first sm:order-none':'border-slate-100'} text-center cursor-pointer"><img src="${pic(d)}" class="w-28 h-28 rounded-2xl mx-auto object-cover mb-4 shadow-md" alt=""><h3 class="font-extrabold text-base">${esc(tr(d.name))}</h3><p class="text-xs text-blue-600 font-semibold mt-1">${esc(tr(d.subject))}</p></div>`).join('');
$('f-cat').innerHTML=[0,1,2,3].map(i=>`<option value="${i}">${t('c'+i)}</option>`).join('');
renderGrid();
}
function renderGrid(){
const q=$('search').value.trim().toLowerCase();
$('grid').innerHTML=db.teachers.filter(x=>!x.dir&&(filter==='all'||x.cat===filter)&&(!q||(tr(x.name)+' '+tr(x.subject)).toLowerCase().includes(q))).map(x=>`
<div onclick="openView(${x.id})" class="card bg-white rounded-3xl p-6 shadow-xl border border-slate-100 cursor-pointer flex flex-col items-center text-center">
<img src="${pic(x)}" class="w-24 h-24 rounded-2xl object-cover mb-4 shadow-md" alt="">
<span class="px-3 py-1 rounded-full bg-blue-50 text-blue-700 text-xs font-semibold mb-2">${t('c'+x.cat)}</span>
<h3 class="font-extrabold text-lg">${esc(tr(x.name))}</h3><p class="text-xs text-slate-500 mt-1">${esc(tr(x.subject))}</p></div>`).join('');
}
function setFilter(f){filter=f;renderAll()}

function chStud(v){if(role!=='admin')return;db.students=Math.max(0,db.students+v);saveData();renderAll();toast(t('upd'))}
function setStud(){if(role!=='admin')return;const v=parseInt($('st-input').value,10);if(!isNaN(v)&&v>=0){db.students=v;saveData();renderAll();toast(t('upd'))}}

function openView(id){
const x=db.teachers.find(o=>o.id===id);if(!x)return;
$('v-img').src=pic(x);
$('v-cat').textContent=x.dir?t('ld'):t('c'+x.cat);
$('v-name').textContent=tr(x.name);$('v-subj').textContent=tr(x.subject);
$('v-exp').textContent=tr(x.experience)||'—';$('v-deg').textContent=tr(x.degree)||'—';
$('v-bio').textContent=tr(x.bio);$('v-ach').textContent=tr(x.achievements);
$('v-phone').textContent=x.phone||'—';$('v-phone').href=x.phone?'tel:'+x.phone.replace(/[^\d+]/g,''):'#';
$('v-admin').classList.toggle('hidden',role!=='admin');
$('v-edit').onclick=()=>openForm(x.id);$('v-del').onclick=()=>delTeacher(x.id);
$('view').classList.remove('hidden');$('view').classList.add('flex');
}
function openForm(id=null){
if(role!=='admin')return;closeM('view');editId=id;
$('f-title').textContent=id!==null?t('et'):t('at');
const x=id!==null?db.teachers.find(o=>o.id===id):null;
$('f-name').value=x?tr(x.name):'';$('f-subj').value=x?tr(x.subject):'';$('f-cat').value=x?Math.max(0,x.cat):0;
$('f-exp').value=x?tr(x.experience):'';$('f-deg').value=x?tr(x.degree):'';
$('f-bio').value=x?tr(x.bio):'';$('f-ach').value=x?tr(x.achievements):'';$('f-phone').value=x?x.phone||'':'';
$('form').classList.remove('hidden');$('form').classList.add('flex');
}
function saveForm(){
if(role!=='admin')return;
const name=$('f-name').value.trim();if(!name)return;
const tri=id=>{const v=$(id).value;return[v,v,v]};
const old=editId!==null?db.teachers.find(o=>o.id===editId):null;
const data={id:editId!==null?editId:Date.now(),name:tri('f-name'),subject:tri('f-subj'),cat:parseInt($('f-cat').value,10),experience:tri('f-exp'),degree:tri('f-deg'),bio:tri('f-bio'),achievements:tri('f-ach'),phone:$('f-phone').value};
if(old){Object.assign(old,data)}else db.teachers.push(data);
saveData();closeM('form');renderAll();toast(t('saved'));
}
function delTeacher(id){
if(role!=='admin')return;
if(confirm(t('cf'))){db.teachers=db.teachers.filter(x=>x.id!==id);saveData();closeM('view');renderAll()}
}
function closeM(id){$(id).classList.add('hidden');$(id).classList.remove('flex')}
function toast(m){const e=$('toast');$('toast-msg').textContent=m;e.classList.remove('hidden');e.classList.add('flex');setTimeout(()=>{e.classList.add('hidden');e.classList.remove('flex')},2500)}

updateTexts();renderAll();
document.querySelectorAll('.cnt').forEach(el=>count(el,+el.dataset.to));
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.1});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
addEventListener('scroll',()=>$('up').classList.toggle('hidden',scrollY<500));
setTimeout(()=>{$('welcome').style.opacity=0;setTimeout(()=>$('welcome').classList.add('hidden'),700)},2600);
</script>
</body>
</html>
